# IForevents, self-hosted.
#
#   curl -fsSLO https://raw.githubusercontent.com/innovafour/iforevents-selfhosted/main/docker-compose.yml
#   docker compose up -d
#   open http://localhost:8010
#
# Nothing else is required. Every value below has a working default; the
# first visit to the dashboard creates the admin account. To change a value,
# put it in a .env file next to this compose file (see .env.example).
#
# Four services, one private network, three persistent volumes:
#
#   dashboard :8010  -> api :8000 -> clickhouse (events, users, projects)
#                                 -> redis      (project cache, rate limits)
#
# Only the api and the dashboard publish a port. ClickHouse and Redis are
# reachable from inside the network alone, which is why their default
# credentials are acceptable: change them anyway if the Docker host is
# shared.
#
# IFOREVENTS_VERSION defaults to the newest release this file was tested
# with; set it in .env to move (releases: github.com/innovafour/iforevents-selfhosted/releases).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      CLICKHOUSE_DB: ${DB_NAME:-iforevents}
      CLICKHOUSE_USER: ${DB_USER:-iforevents}
      CLICKHOUSE_PASSWORD: ${DB_PASSWORD:-iforevents}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/iforevents.xml:/etc/clickhouse-server/config.d/iforevents.xml:ro
      - ./backups:/backups
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [iforevents]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [iforevents]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/innovafour/iforevents-api:${IFOREVENTS_VERSION:-1.1.0}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment:
      # Self-hosted mode: no accounts service, no plan limits, signup opens
      # once for the first admin and closes (SIGNUP_MODE), TOKEN_SECRET is
      # generated on first boot into /var/lib/iforevents unless provided.
      SELF_HOSTED: "true"
      ENV: production
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: /var/lib/iforevents

      # Where browsers open the dashboard, and where SDKs send events. Used
      # for CORS, e-mail links and the SDK snippets shown in the dashboard.
      APP_BASE_URL: ${PUBLIC_URL:-http://localhost:8010}
      ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8010}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

      DB_HOST: clickhouse
      DB_PORT: "9000"
      DB_NAME: ${DB_NAME:-iforevents}
      DB_USER: ${DB_USER:-iforevents}
      DB_PASSWORD: ${DB_PASSWORD:-iforevents}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # No RABBITMQ_URL: the broker only carries the Cloud destinations bus,
      # which a self-hosted install does not run.

      # Optional. Leave empty to create the admin from the dashboard on the
      # first visit instead. Ignored once any account exists.
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      SIGNUP_MODE: ${SIGNUP_MODE:-bootstrap}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-My organization}

      # Optional: Resend API key, or an SMTP relay. Without either, accounts
      # are verified on creation and reset links are written to the api log
      # (docker compose logs api).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}

      EVENTS_RETENTION_DAYS: ${EVENTS_RETENTION_DAYS:-0}
      MAX_EVENTS_PER_BATCH: ${MAX_EVENTS_PER_BATCH:-500}
      RATE_LIMIT_INGEST_RATE: ${RATE_LIMIT_INGEST_RATE:-500}
      RATE_LIMIT_INGEST_BURST: ${RATE_LIMIT_INGEST_BURST:-2000}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-["https://claude.ai","https://chatgpt.com"]}
    volumes:
      - api_data:/var/lib/iforevents
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [iforevents]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  dashboard:
    image: ghcr.io/innovafour/iforevents-dashboard:${IFOREVENTS_VERSION:-1.1.0}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-8010}:8010"
    environment:
      PORT: "8010"
      # Sessions are issued by the api itself (AUTH_MODE=local); the hosted
      # accounts service is not part of a self-hosted install. Dashboards
      # newer than 1.0.0-rc.1 detect this from the api (GET /v1/setup/status,
      # self_hosted) when the variable is unset; it stays set here so the
      # pinned image works either way.
      AUTH_MODE: local
      API_BASE_URL: http://api:8000/v1
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8010}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      # Session cookies carry the Secure flag only behind https (derived from
      # PUBLIC_URL); a plain-http LAN install would otherwise never sign in.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    depends_on:
      api:
        condition: service_healthy
    networks: [iforevents]
    healthcheck:
      # The image is distroless (no shell, no wget), hence the node probe.
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:8010/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  api_data:

networks:
  iforevents:
    driver: bridge
    ipam:
      config:
        # Fixed so TRUSTED_PROXY_CIDRS can name it when a reverse proxy
        # (docker-compose.caddy.yml) runs inside the network. Change it if it
        # collides with an existing network on the host.
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

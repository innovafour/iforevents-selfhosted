# Proves the install on every change: the compose file must parse with no
# .env, and a fresh `docker compose up -d` with the latest public images
# must give a working server (scripts/smoke.sh).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a broken `latest` image or an upstream base image change
    # is noticed even when this repository is quiet.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compose files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f docker-compose.yml config --quiet
      - run: DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.caddy.yml config --quiet
      - name: No secrets, no .env committed
        run: |
          test ! -f .env
          ! grep -RIn --exclude-dir=.git -E '(ghp_|github_pat_|AKIA)[A-Za-z0-9_]{10,}' . || { echo "credential-shaped string found" >&2; exit 1; }

  install:
    name: Fresh install works (latest images)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/smoke.sh
        env:
          IFOREVENTS_VERSION: ${{ vars.SMOKE_VERSION || 'latest' }}
